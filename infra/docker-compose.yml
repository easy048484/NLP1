services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - path: ../.env
        required: false   # .env를 아직 안 만들었어도 mock API는 기동은 되도록 (진짜 키가 필요한 기능을 쓸 때만 채워 넣으면 됨)
    # 지금은 mock API가 DB를 전혀 쓰지 않으므로(3단계 전) db에 종속시키지 않습니다.
    # Alembic/세션 저장이 붙는 3단계부터 `depends_on: [db]`를 다시 추가하세요.

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: family_assets
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
