name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nlp1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nlp1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: black --check .
      # 마이그레이션 자체가 검증 대상입니다 — upgrade/downgrade/upgrade를
      # 한 번 왕복시켜서 downgrade()가 실제로 깨끗하게 되돌리는지(예:
      # ENUM 타입까지 지우는지)까지 CI에서 잡습니다. family_graph DB 연결
      # PR에서 로컬로 검증했던 것과 동일한 절차입니다.
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: pytest -q
